[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

solc_version = "0.8.28"
# Cancun verified live on BOT Chain 968 and 677 (PUSH0/TLOAD/TSTORE/MCOPY probed OK, 2026-08-31).
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false

bytecode_hash = "none"
cbor_metadata = false

ffi = false
fs_permissions = [{ access = "read", path = "./deployments" }]

[profile.ci]
verbosity = 3
fuzz = { runs = 5000 }
invariant = { runs = 512, depth = 128 }

[fuzz]
runs = 1000

[invariant]
runs = 128
depth = 64
fail_on_revert = false

[rpc_endpoints]
bohr    = "https://rpc.bohr.life"
botchain = "https://rpc.botchain.ai"

# BOT Chain runs Blockscout with the Rust verifier microservice enabled.
[etherscan]
bohr     = { key = "", url = "https://scan.bohr.life/api", chain = 968 }
botchain = { key = "", url = "https://scan.botchain.ai/api", chain = 677 }

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"
